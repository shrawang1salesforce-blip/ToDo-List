<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do list</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-labelledby="page-title">
        <h1 id="page-title">To-do list</h1>
        <p class="intro">Keep track of the things you want to get done.</p>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What needs doing?"
            autocomplete="off"
            required
          />
          <button type="submit">Add task</button>
        </form>

        <div class="list-heading">
          <h2>Your tasks</h2>
          <span id="task-count" class="task-count">0 tasks</span>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="empty-message" class="empty-message">
          Nothing here yet. Add your first task above.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
